name: C++ Portability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Show compiler version
        run: ${{ matrix.cxx }} --version

      - name: Build
        run: make CXX=${{ matrix.cxx }}

      - name: Run tests
        run: make test CXX=${{ matrix.cxx }}
