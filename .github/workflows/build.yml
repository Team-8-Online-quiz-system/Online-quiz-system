name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe input functions (OQS-SR-001)
        run: |
          if grep -rnE '\bgets\(|scanf\("%s"|\bstrcpy\(' src tests; then
            echo "Unsafe input function found."
            exit 1
          fi

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Smoke test
        run: |
          printf '1\nTeam8\nB\nA\nB\nC\nB\n1\nA\nA\nA\nA\nA\n2\n' | ./quiz --plain | tee output.txt
          grep -q "Welcome, Team8" output.txt
          grep -q "Question 5 of 5" output.txt
          grep -q "Final score for Team8: 5 / 5" output.txt
          grep -q "Starting a new attempt. Your score is back to 0." output.txt
          grep -q "Final score for Team8: 1 / 5" output.txt
          grep -q "Thanks for playing, Team8! Goodbye." output.txt
          if grep -q $'\x1b\[' output.txt; then echo "Piped output must be plain"; exit 1; fi
